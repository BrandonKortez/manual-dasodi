<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual del server · Vista Discord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="discord.css">
  <link rel="icon" href="../assets/megaman-idle.png">
</head>
<body>
  <div class="app">

    <!-- 1. Columna de servidores -->
    <nav class="servers" aria-label="Servidores">
      <a class="srv srv-home" href="../index.html" title="Manual clásico">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M4 5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13H6a1 1 0 0 0 0 2h12v1a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5Zm4 1v2h7V6H8Z"/></svg>
        <span class="srv-tip">Manual clásico</span>
      </a>
      <div class="srv-sep" aria-hidden="true"></div>
      <button class="srv srv-active" type="button" aria-current="true">
        <span class="srv-pill" aria-hidden="true"></span>
        <span id="srvInitials" class="srv-initials">CG</span>
        <span id="srvTip" class="srv-tip">Servidor</span>
      </button>
    </nav>

    <!-- 2. Barra de canales -->
    <aside class="sidebar" aria-label="Canales">
      <header class="guild-header">
        <span id="guildName" class="guild-name">Servidor</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5.3 9.3a1 1 0 0 1 1.4 0L12 14.6l5.3-5.3a1 1 0 1 1 1.4 1.4l-6 6a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.4Z"/></svg>
      </header>

      <div class="legend" id="legend" aria-label="Estado del server"></div>

      <div class="channels" id="channels"></div>

      <!-- Panel de usuario -->
      <div class="user-panel">
        <div class="user-avatar"><img src="../assets/megaman-idle.png" alt=""><span class="status-dot"></span></div>
        <div class="user-names">
          <span class="user-name">Manual</span>
          <span class="user-sub" id="userSub">Vista Discord</span>
        </div>
        <button id="soundBtn" class="icon-btn" type="button" aria-pressed="false" title="Sonido"></button>
      </div>
    </aside>

    <!-- 3. Contenido -->
    <main class="main" id="main" aria-live="polite">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Mostrar canales">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg>
        </button>
        <span id="topIcon" class="top-icon" aria-hidden="true"></span>
        <h1 id="topName" class="top-name"></h1>
        <span id="topState" class="top-state"></span>
        <span class="top-divider" aria-hidden="true"></span>
        <span id="topTopic" class="top-topic"></span>
        <button id="membersBtn" class="icon-btn members-btn" type="button" aria-label="Mostrar miembros">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M14.5 8a3 3 0 1 0-6 0 3 3 0 0 0 6 0Zm-9 11c0-3 2.7-5.5 6-5.5s6 2.5 6 5.5H5.5Zm12-11.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm1 7c2 .6 3.5 2.3 3.5 4.5h-3.2c-.2-1.8-1-3.3-2.2-4.4l1.9-.1Z"/></svg>
        </button>
      </header>

      <div class="chat" id="chat">
        <div class="chat-inner" id="chatInner"></div>
      </div>

      <div class="composer">
        <div class="composer-box" id="composer">Este canal es parte del manual: usa los botones de arriba para confirmar su estado.</div>
      </div>
    </main>

    <!-- 4. Miembros: roles y bots -->
    <aside class="members" id="members" aria-label="Roles y bots"></aside>
  </div>

  <div id="modal" class="modal-root" hidden></div>
  <div class="scanlines" aria-hidden="true"></div>

  <script src="../content.js"></script>
  <script src="perms.js"></script>
  <script src="server-map.js"></script>
  <script src="discord.js"></script>
</body>
</html>
